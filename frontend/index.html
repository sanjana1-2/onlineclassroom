<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Classroom Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            colors: {
              primary: '#3B82F6',
              secondary: '#10B981',
              danger: '#EF4444',
              dark: '#0f172a',
              darker: '#020617',
            },
            animation: {
              'blob': 'blob 7s infinite',
              'slide-up': 'slideUp 0.5s ease-out',
              'fade-in': 'fadeIn 0.5s ease-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <!-- Polyfills for WebRTC/Buffer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
    <script>
      window.global = window;
      // The buffer.min.js script above defines window.Buffer automatically.
      // We just need to ensure 'process' exists for compatibility.
      window.process = window.process || { 
        env: { NODE_ENV: 'production' },
        version: '',
        nextTick: function(fn) { setTimeout(fn, 0); }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Error catcher: shows crash instead of blank page -->
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.innerHTML) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:monospace;padding:2rem;text-align:center">' +
            '<div style="font-size:2rem;margin-bottom:1rem">💔</div>' +
            '<h2 style="color:#f43f5e;margin-bottom:1rem">App Error</h2>' +
            '<pre style="background:#1e293b;padding:1rem;border-radius:8px;max-width:700px;overflow:auto;font-size:0.8rem;color:#fca5a5;text-align:left;white-space:pre-wrap;word-break:break-word">' +
            (e.message || '') + '\n\n' + (e.error && e.error.stack ? e.error.stack : '') +
            '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && !root.innerHTML) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:monospace;padding:2rem;text-align:center">' +
            '<div style="font-size:2rem;margin-bottom:1rem">💔</div>' +
            '<h2 style="color:#f43f5e;margin-bottom:1rem">Unhandled Promise Error</h2>' +
            '<pre style="background:#1e293b;padding:1rem;border-radius:8px;max-width:700px;overflow:auto;font-size:0.8rem;color:#fca5a5;text-align:left;white-space:pre-wrap;word-break:break-word">' +
            (e.reason ? (e.reason.message || String(e.reason)) : 'Unknown') + '\n\n' +
            (e.reason && e.reason.stack ? e.reason.stack : '') +
            '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
